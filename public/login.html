<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System - Login</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }

        body {
            background: linear-gradient(135deg, #1e2a38 0%, #1a73e8 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo h1 {
            font-size: 32px;
            color: #1a73e8;
        }

        .login-logo p {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }

        .form-group input:focus {
            border-color: #1a73e8;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .login-btn:hover { background: #1558b0; }

        .error-msg {
            background: #fde8e8;
            color: #ea4335;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        .login-info {
            margin-top: 24px;
            padding: 16px;
            background: #f8f9ff;
            border-radius: 10px;
            font-size: 12px;
            color: #666;
        }

        .login-info p { margin-bottom: 4px; }
        .login-info strong { color: #1a73e8; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="login-logo">
            <h1>🛒 SuperMart</h1>
            <p>Point of Sale System</p>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" />
        </div>

        <button class="login-btn" onclick="login()">🔐 Login</button>

    </div>

    <script>
        const API = 'http://127.0.0.1:8000/api';

        // If already logged in → redirect
        if (localStorage.getItem('pos_token')) {
            const role = localStorage.getItem('pos_role');
            window.location.href = role === 'admin' ? 'admin.html' : 'pos.html';
        }

        async function login() {
            const email    = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            if (!email || !password) {
                showError('Please enter email and password!');
                return;
            }

            const res = await fetch(`${API}/login`, {
                method:  'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept':       'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('pos_token', data.token);
                localStorage.setItem('pos_user',  data.user.name);
                localStorage.setItem('pos_role',  data.user.role);

                // Redirect based on role
                if (data.user.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'pos.html';
                }
            } else {
                showError('❌ Invalid email or password!');
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        // Login on Enter key
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>

</body>
</html>
